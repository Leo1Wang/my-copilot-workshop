<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <p class="eyebrow">今日計畫</p>
      <h1>待辦清單</h1>
      <p class="subtitle">把想完成的事，一件一件放進今天。</p>
    </header>

    <form class="todo-form" id="todo-form">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        type="text"
        placeholder="接下來要完成什麼？"
        autocomplete="off"
        maxlength="120"
      >
      <button type="submit">新增</button>
    </form>
    <div class="todo-filters" aria-label="待辦事項篩選">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <section class="todo-section" aria-live="polite">
      <p class="empty-state" id="empty-state">還沒有任何待辦事項，新增一個吧!</p>
      <ul class="todo-list" id="todo-list"></ul>
    </section>

    <footer class="todo-footer">
      <span id="remaining-count">未完成：0 項</span>
    </footer>
  </main>
</body>
</html>
